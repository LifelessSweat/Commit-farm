name: Automated Commit Farm

on:
  schedule:
    # 1. Runs automatically every 5 minutes (500 commits)
    - cron: '*/5 * * * *'
    # 2. Runs automatically once a day at 12:00 AM EDT (2500 commits)
    - cron: '0 4 * * *'
    # 3. Runs automatically once a day at 12:00 PM Noon EDT (1000 commits)
    - cron: '0 16 * * *'
  # Allows you to manually trigger a batch anytime
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Instant Database Injection Farm
        run: |
          git config --local user.email "253367238+LifelessSweat@users.noreply.github.com"
          git config --local user.name "LifelessSweat"
          
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          NUM_COMMITS=500
          
          if [ "$HOUR" == "04" ] && [ "$MINUTE" -lt "06" ]; then
            echo "12:00 AM EDT detected! Preparing 2500 fast commits."
            NUM_COMMITS=2500
          elif [ "$HOUR" == "16" ] && [ "$MINUTE" -lt "06" ]; then
            echo "12:00 PM Noon EDT detected! Preparing 1000 fast commits."
            NUM_COMMITS=1000
          else
            echo "Standard interval. Preparing 500 fast commits."
          fi
          
          # 1. Create a fresh file variation and stage it to get a base tree structure
          echo "Farm update payload: $(date)" >> farm-log.txt
          git add farm-log.txt
          TREE_SHA=$(git write-tree)
          PARENT_SHA=$(git rev-parse HEAD)
          
          # 2. Inject raw commit objects directly into git database sequentially via memory
          echo "Injecting $NUM_COMMITS commits natively..."
          for i in $(seq 1 $NUM_COMMITS)
          do
            PARENT_SHA=$(echo "Automated farm commit #$i" | git commit-tree $TREE_SHA -p $PARENT_SHA)
          done
          
          # 3. Point the main branch reference directly to the tip of our massive commit chain
          git update-ref refs/heads/main $PARENT_SHA

      - name: 3. Push massive payload to repo
        run: |
          git push origin main --force
