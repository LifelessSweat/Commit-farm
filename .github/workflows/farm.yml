name: Automated Commit Farm

on:
  schedule:
    # 1. Runs automatically every 5 minutes (500 commits)
    - cron: '*/5 * * * *'
    # 2. Runs automatically once a day at 12:00 AM EDT (2500 commits)
    - cron: '0 4 * * *'
    # 3. Runs automatically once a day at 12:00 PM Noon EDT (1000 commits)
    - cron: '0 16 * * *'
  # Allows you to manually trigger a batch anytime
  workflow_dispatch:

jobs:
  farm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Smart Bulk Farm
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Get current hour and minute in UTC
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          
          # Default to 500 commits every 5 minutes
          NUM_COMMITS=500
          
          # Check for specific daily bursts
          if [ "$HOUR" == "04" ] && [ "$MINUTE" -lt "06" ]; then
            echo "12:00 AM EDT detected! Switching to 2500 bulk commits."
            NUM_COMMITS=2500
          elif [ "$HOUR" == "16" ] && [ "$MINUTE" -lt "06" ]; then
            echo "12:00 PM Noon EDT detected! Switching to 1000 bulk commits."
            NUM_COMMITS=1000
          else
            echo "Standard interval detected. Running 500 commits."
          fi
          
          # Execute the loop based on the determined amount
          for i in $(seq 1 $NUM_COMMITS)
          do
            echo "Farm update $i: $(date)" >> farm-log.txt
            git add farm-log.txt
            git commit -m "Automated farm commit #$i"
          done

      - name: 3. Push changes back to repo
        run: |
          git push origin main
